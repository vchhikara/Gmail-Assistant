<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail Assistant Mockups</title>
<style>
/* Design kit tokens and base styles. Plain CSS, no framework needed. */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

:root {
  /* color */
  --bg: #f0fdf4;            /* green-50, window background */
  --panel: #ffffff;         /* main content panel */
  --card: #dcfce7;          /* green-100, list cards */
  --accent: #bbf7d0;        /* green-200, selected and checked */
  --on-accent: #000000;
  --text: #000000;
  --fill: rgba(107, 114, 128, 0.1);   /* gray at 10%: hover and idle control fill */
  --fill-strong: rgba(107, 114, 128, 0.2);
  --border: #d4d4d4;
  --danger: #ef4444;
  /* shape */
  --r-check: 0.5rem;
  --r-control: 0.75rem;     /* buttons, toggles, fields, window */
  --r-card: 1.5rem;
  --r-panel: 3rem;          /* top-left corner of the content panel */
  /* motion */
  --t-press: 150ms;
  --t-fill: 250ms;
  --t-slide: 300ms;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: ease-out;
  color-scheme: light;
}

:root.dark {
  --bg: #171717;            /* neutral-900 */
  --panel: #262626;         /* neutral-800 */
  --card: #404040;          /* neutral-700 */
  --text: #f5f5f5;
  --border: #404040;
  color-scheme: dark;
}

html, body { margin: 0; background: transparent; color: var(--text); font-family: 'Montserrat', sans-serif; }

/* Window frame: rounded, 1px border. Use with a transparent, frameless window. */
.app-frame { position: relative; border-radius: var(--r-control); border: 1px solid var(--border); background: var(--bg); overflow: hidden; }
html.maximized .app-frame { border-radius: 0; border-width: 0; }

/* Button: no fill at rest, gray fill on hover, shrinks on press */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  height: 3rem; padding: 0 1rem; border-radius: var(--r-control);
  font-weight: 500; cursor: pointer; user-select: none;
  transition: background-color var(--t-press) ease-in-out, transform var(--t-press) ease-in-out;
}
.btn:hover { background: var(--fill); }
.btn:active { transform: scale(0.95); }

.titlebar-btn { display: flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border-radius: .5rem; cursor: pointer; }
.titlebar-btn:hover { background: var(--fill-strong); }
.titlebar-btn.close:hover { background: var(--danger); color: #fff; }

/* Checkbox: gray fill at rest, green when checked, check mark pops with a spring */
.checkbox {
  position: relative; flex-shrink: 0; width: 1.5rem; height: 1.5rem; cursor: pointer;
  appearance: none; -webkit-appearance: none; border: 0; border-radius: var(--r-check);
  background: var(--fill);
  transition: background-color var(--t-fill) ease, transform var(--t-press) ease;
}
.checkbox::before {
  content: ''; position: absolute; left: 50%; top: 46%; width: .4rem; height: .7rem;
  border: solid var(--on-accent); border-width: 0 2px 2px 0; opacity: 0;
  transform: translate(-50%, -50%) rotate(45deg) scale(0);
  transition: transform .3s var(--spring), opacity .15s ease;
}
.checkbox:checked { background: var(--accent); }
.checkbox:checked::before { opacity: 1; transform: translate(-50%, -50%) rotate(45deg) scale(1); }
.checkbox:active { transform: scale(0.9); }
.checkbox:focus { outline: none; }

/* Row that holds a label and a control: gray fill on hover */
.row { display: flex; align-items: center; justify-content: space-between; padding: .75rem; border-radius: var(--r-control); cursor: pointer; transition: background-color var(--t-press) ease; }
.row:hover { background: var(--fill); }

/* Segmented toggle: the highlight slides to the selected option */
.segmented { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: .25rem; border-radius: var(--r-control); background: var(--fill); }
.segmented .thumb {
  position: absolute; top: .25rem; bottom: .25rem; left: .25rem;
  width: calc((100% - .5rem) / var(--count, 3)); border-radius: .5rem; background: var(--accent);
  transform: translateX(calc(var(--index, 0) * 100%));
  transition: transform var(--t-slide) var(--ease);
}
.segmented .opt { position: relative; z-index: 1; padding: .25rem .75rem; text-align: center; font-size: .875rem; border-radius: .5rem; cursor: pointer; transition: background-color var(--t-slide), color var(--t-slide); }
.segmented .opt:not(.on):hover { background: var(--fill); }
.segmented .opt.on { color: var(--on-accent); }

/* Editable text: reads as plain text, a gray pill appears on hover and while editing */
.editable { display: flex; align-items: center; gap: .5rem; padding: .25rem .75rem; margin: 0 -.75rem; width: 18rem; max-width: 100%; border-radius: var(--r-control); cursor: pointer; transition: background-color var(--t-slide); }
.editable:hover, .editable.editing { background: var(--fill); }
.editable.editing { cursor: text; }
.editable input { font: inherit; font-size: 1.5rem; font-weight: 500; color: inherit; background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; }
.editable .icon { opacity: .4; transition: opacity var(--t-slide); }
.editable:hover .icon { opacity: 1; }

/* Modal: dim backdrop, white panel, rounded corners */
.backdrop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
.modal { width: 24rem; padding: 1rem; border-radius: var(--r-control); background: var(--panel); box-shadow: 0 20px 25px -5px rgba(0,0,0,.2); }

/* Layout shell: tinted window, white panel with one large rounded corner */
.panel { background: var(--panel); border-top-left-radius: var(--r-panel); padding: 3rem; }
.item-card { border-radius: var(--r-card); padding: 1rem; background: var(--card); }

svg { fill: currentColor; }

</style>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  .checkbox, .checkbox::before { box-sizing: content-box; }
  .checkbox { box-sizing: border-box; }
  body { background: var(--bg); min-height: 100vh; transition: background-color var(--t-slide) ease; }
  .page { max-width: 1280px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
  .top h1 { margin: 0; font-size: 1.5rem; font-weight: 500; }
  .top p { margin: .25rem 0 0; font-size: .875rem; opacity: .6; }
  .top .segmented { width: 17rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 3rem 2rem; justify-items: center; }
  figure { margin: 0; }
  figcaption { margin-top: .875rem; text-align: center; font-size: .875rem; font-weight: 500; opacity: .7; }

  /* phone */
  .phone { position: relative; width: 360px; height: 740px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border); border-radius: 2.25rem; transition: background-color var(--t-slide) ease; }
  .status { display: flex; justify-content: space-between; padding: .75rem 1.5rem 0; font-size: .75rem; font-weight: 500; }
  header { display: flex; align-items: center; justify-content: space-between; padding: .75rem 1rem .875rem 1.5rem; }
  header h2 { margin: 0; font-size: 1.25rem; font-weight: 500; }
  header .sub { font-size: .75rem; opacity: .6; margin-top: .125rem; }
  .sync { height: 2.5rem; padding: 0 .875rem; background: var(--fill); font-size: .875rem; }
  .sync:hover { background: var(--fill-strong); }
  .sync svg { width: 1.125rem; height: 1.125rem; transition: transform var(--t-slide) var(--ease); }
  .sync:hover svg { transform: rotate(180deg); }

  .panel { flex: 1; min-height: 0; padding: 1.5rem 1rem 0; overflow: hidden; display: flex; flex-direction: column; gap: .75rem; transition: background-color var(--t-slide) ease; }
  .panel h3 { margin: 0; font-size: 1.5rem; font-weight: 500; }
  .panel h4 { margin: 0; font-size: 1rem; font-weight: 600; }
  .hero { padding: 0 1.5rem 1.25rem; }
  .hero h3 { margin: 0; font-size: 1.5rem; font-weight: 500; }
  .muted { font-size: .75rem; opacity: .6; line-height: 1.5; }

  .nav { margin: .5rem .75rem .75rem; }
  .phone { --r-mid: 1rem; }
  .phone .btn, .phone .ibtn, .phone .segmented { border-radius: var(--r-mid); }
  .phone .segmented .thumb, .phone .segmented .opt { border-radius: calc(var(--r-mid) - .25rem); }
  .phone .nav { border-radius: 1.25rem; }
  .phone .nav .thumb, .phone .nav .opt { border-radius: 1rem; }
  .nav .opt { display: flex; flex-direction: column; align-items: center; gap: .125rem; padding: .5rem 0 .375rem; font-size: .6875rem; font-weight: 500; }
  .nav .opt svg { width: 1.25rem; height: 1.25rem; }

  .pill { display: inline-block; font-size: .6875rem; font-weight: 500; padding: .125rem .625rem; border-radius: 999px; background: var(--fill); }
  .item-card { transition: background-color var(--t-fill) ease, transform var(--t-press) ease-in-out; }

  /* email row */
  .mail { display: block; border-radius: var(--r-card); padding: .875rem 1rem; cursor: pointer; background: var(--fill); transition: background-color var(--t-fill) ease, transform var(--t-press) ease-in-out; }
  .mail.unread { background: var(--card); }
  .mail:hover { background: var(--fill-strong); }
  .mail:active { transform: scale(.97); }
  .mail .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-size: .875rem; }
  .mail .l1 b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail:not(.unread) .l1 b { font-weight: 500; }
  .mail .time { font-size: .6875rem; opacity: .6; flex-shrink: 0; }
  .mail .subj { margin-top: .125rem; font-size: .8125rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail:not(.unread) .subj { font-weight: 400; opacity: .75; }
  .mail .snip { margin-top: .25rem; font-size: .75rem; opacity: .6; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mail .tag { margin-top: .5rem; }

  .box { background: var(--card); border-radius: var(--r-card); padding: .875rem .5rem; transition: background-color var(--t-fill) ease; }
  .box > h4 { padding: 0 .5rem; margin-bottom: .25rem; }
  .box > .btn { margin-top: .375rem; }
  .stack { display: flex; flex-direction: column; gap: .5rem; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .actions .btn, .btn.solid { background: var(--fill); font-size: .8125rem; padding: 0 .5rem; height: 2.75rem; }
  .actions .btn:hover, .btn.solid:hover { background: var(--fill-strong); }
  .btn.solid.wide { width: 100%; }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: var(--r-control); cursor: pointer; flex-shrink: 0; transition: background-color var(--t-press) ease-in-out, transform var(--t-press) ease-in-out; }
  .ibtn:hover { background: var(--fill-strong); }
  .ibtn:active { transform: scale(.9); }
  .ibtn svg { width: 1.25rem; height: 1.25rem; }

  .row .who { min-width: 0; flex: 1; margin-left: .75rem; }
  .row .who b { display: block; font-size: .875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .who span { display: block; font-size: .75rem; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { justify-content: flex-start; padding: .625rem .5rem; }
  .row.plain { cursor: default; }

  .avatar { width: 4rem; height: 4rem; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 500; }
  .seg-small .opt .n { display: inline-block; min-width: 1rem; height: 1rem; line-height: 1rem; margin-left: .25rem; padding: 0 .25rem; border-radius: .5rem; font-size: .625rem; font-weight: 600; background: var(--fill-strong); }
  .seg-small .opt.on .n { background: rgba(0,0,0,.12); }
  .seg-small .opt { font-size: .75rem; padding: .375rem 0; }
  .seg-5 { --count: 5; }

  /* sheet */
  .backdrop { z-index: 5; align-items: flex-end; }
  .sheet { width: 100%; background: var(--panel); border-radius: 1.5rem 1.5rem 0 0; padding: 1.25rem 1rem 1.25rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: .875rem; max-height: 86%; }
  .sheet .grab { width: 2.5rem; height: .25rem; border-radius: 999px; background: var(--fill-strong); align-self: center; }
  .sheet .head { display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 { margin: 0; font-size: 1.125rem; font-weight: 500; line-height: 1.35; }
  .sheet .meta { display: flex; align-items: center; gap: .5rem; font-size: .75rem; }
  .sheet .meta span:last-child { opacity: .6; }
  .sheet .summary { border-radius: var(--r-card); padding: .875rem 1rem; background: var(--card); }
  .sheet .summary b { font-size: .8125rem; font-weight: 600; }
  .sheet .summary p { margin: .375rem 0 0; font-size: .8125rem; line-height: 1.55; }
  .sheet .snippet { font-size: .75rem; line-height: 1.55; opacity: .65; }
  .dim-list { padding: 1.5rem 1rem 0; }
</style>
</head>

    <!-- SETTINGS -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>5G</span></div>
        <header>
          <div><h2>Gmail Assistant</h2><div class="sub">Synced 2 min ago</div></div>
          <div class="btn sync"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>Sync</div>

        <div class="panel" style="background:var(--panel);border-top-left-radius:var(--r-panel);gap:1rem">

<script>
  const I = {
    inbox: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H5V5h14v10z',
    buckets: 'M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z',
    cleanup: 'M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z',
    settings: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'
  };
  const tabs = [['inbox','Inbox'],['buckets','Buckets'],['cleanup','Cleanup'],['settings','Settings']];

  // bottom navigation: green thumb slides to the chosen tab
  document.querySelectorAll('[data-nav]').forEach(nav => {
    nav.style.setProperty('--count', 4);
    nav.style.setProperty('--index', nav.dataset.nav);
    nav.innerHTML = '<div class="thumb"></div>' + tabs.map(([k, label], i) =>
      `<div class="opt${i == nav.dataset.nav ? ' on' : ''}"><svg viewBox="0 0 24 24"><path d="${I[k]}"/></svg>${label}</div>`).join('');
    nav.querySelectorAll('.opt').forEach((o, i) => o.addEventListener('click', () => {
      nav.style.setProperty('--index', i);
      nav.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o));
    }));
  });

  // bucket tabs
  document.querySelectorAll('[data-seg]').forEach(seg => {
    seg.querySelectorAll('.opt').forEach((o, i) => o.addEventListener('click', () => {
      seg.style.setProperty('--index', i);
      seg.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o));
    }));
  });

  // unsubscribe count follows the checkboxes
  const boxes = document.querySelectorAll('#unsub .checkbox');
  const btn = document.getElementById('unsubBtn');
  const sync = () => { const n = [...boxes].filter(b => b.checked).length; btn.textContent = n ? `Unsubscribe from ${n}` : 'Select senders'; };
  boxes.forEach(b => b.addEventListener('change', sync));

  // theme: top toggle and the settings toggle stay in step
  const mq = matchMedia('(prefers-color-scheme: dark)');
  let pref = 'system';
  function applyTheme() {
    const dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.classList.toggle('dark', dark);
    document.querySelectorAll('#themeToggle, [data-themeseg]').forEach(seg => {
      const opts = [...seg.querySelectorAll('.opt')];
      const idx = opts.findIndex(o => o.dataset.v === pref);
      seg.style.setProperty('--index', idx);
      opts.forEach((o, i) => o.classList.toggle('on', i === idx));
    });
  }
  document.querySelectorAll('#themeToggle .opt, [data-themeseg] .opt').forEach(o => o.addEventListener('click', () => { pref = o.dataset.v; applyTheme(); }));
  mq.addEventListener('change', applyTheme);
  applyTheme();
</script>
